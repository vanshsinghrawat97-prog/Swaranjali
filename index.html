<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swaranjali</title>
<link rel="icon" href="Lotus-removebg-preview.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap">
<style>
:root{--bg:#f6f1e4;--bg2:#ece4cf;--ink:#1f3a2c;--soft:#5b6f60;--gold:#b87a00;--rose:#b83a62;--leaf:#3f7d4e;--glass:rgba(255,252,243,.62);--line:rgba(31,58,44,.2);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d241c;--bg2:#143328;--ink:#f3ecd8;--soft:#a9bba9;--gold:#f2b632;--rose:#ee7a9c;--leaf:#6fb583;--glass:rgba(20,51,40,.6);--line:rgba(243,236,216,.2)}}
:root[data-theme="dark"]{--bg:#0d241c;--bg2:#143328;--ink:#f3ecd8;--soft:#a9bba9;--gold:#f2b632;--rose:#ee7a9c;--leaf:#6fb583;--glass:rgba(20,51,40,.6);--line:rgba(243,236,216,.2)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg));color:var(--ink);font:400 1.15rem/1.7 "Cormorant Garamond","Tiro Devanagari Hindi",Georgia,serif;min-height:100vh;overflow-x:hidden}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main,header,footer{position:relative;z-index:1}
.vine{position:absolute;top:0;width:min(34vw,220px);opacity:.9;pointer-events:none}
.vine.l{left:0}.vine.r{right:0;transform:scaleX(-1)}
header{text-align:center;padding:4.5rem 1.2rem 1.5rem}
.bloom{width:min(62vw,230px);height:auto;margin:0 auto .5rem;display:block;overflow:visible}
.bloom .p{transform-origin:100px 100px;transform:scale(0);animation:open 1.6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.09s)}
@keyframes open{to{transform:scale(1)}}
h1{font-weight:600;font-size:clamp(2.4rem,9vw,4.4rem);line-height:1.05;margin:.2rem 0;letter-spacing:.01em}
.sub{color:var(--soft);font-style:italic;margin:0 auto;max-width:34ch}
.tabs{display:flex;justify-content:center;gap:.6rem;margin:2rem 0 1.4rem;flex-wrap:wrap}
.tab{font:inherit;font-size:1.2rem;padding:.55rem 1.6rem;border-radius:999px 999px 999px 4px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .25s,color .25s,border-color .25s}
.tab[aria-selected="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
.tab:focus-visible,.card:focus-visible,.close:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.grid{max-width:980px;margin:0 auto;padding:0 1.2rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.3rem}
.card{position:relative;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:1.5rem 1.4rem 1.3rem;background:var(--glass);border:1px solid var(--line);border-radius:28px 6px 28px 6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--gold)}
.card h2{margin:0 0 .5rem;font-size:1.6rem;font-weight:600;color:var(--rose)}
.card p{margin:0;color:var(--soft);font-style:italic;white-space:pre-line}
.card svg{position:absolute;right:.9rem;bottom:.7rem;width:34px;opacity:.7}
dialog{border:1px solid var(--line);border-radius:36px 8px 36px 8px;background:var(--bg);color:var(--ink);width:min(560px,92vw);max-height:86vh;padding:0;overflow:hidden}
dialog::backdrop{background:rgba(5,20,14,.62);backdrop-filter:blur(6px)}
.sheet{padding:2rem 1.8rem 2.2rem;max-height:86vh;overflow:auto;text-align:center;scrollbar-width:none;-ms-overflow-style:none}
.sheet::-webkit-scrollbar{display:none;width:0;height:0}
dialog{scrollbar-width:none}
dialog::-webkit-scrollbar{display:none}
.sheet h3{font-size:2rem;margin:.3rem 0 .2rem;color:var(--rose);font-weight:600}
.sheet .orn{width:120px;margin:0 auto .8rem;display:block}
.sheet pre{font:inherit;font-size:1.3rem;line-height:1.9;white-space:pre-wrap;margin:1rem 0 0}
.close{position:absolute;top:.8rem;right:1rem;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;border-radius:999px;padding:.2rem .9rem;cursor:pointer}
footer{text-align:center;color:var(--soft);padding:1rem 1rem 3rem;font-style:italic}
@media(prefers-reduced-motion:reduce){.bloom .p{animation:none;transform:scale(1)}.card{transition:none}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<svg class="vine l" viewBox="0 0 200 420" fill="none" stroke="var(--leaf)" stroke-width="2" aria-hidden="true"><path d="M10 0C70 80 20 150 90 220S40 340 120 420"/><g fill="var(--leaf)" fill-opacity=".35"><path d="M52 70c30-20 50-6 52 8-24 14-44 10-52-8z"/><path d="M42 150c-28-14-48 2-48 16 24 12 42 6 48-16z"/><path d="M80 230c32-12 50 4 50 18-26 10-44 2-50-18z"/><path d="M62 320c-28-10-46 6-44 20 22 8 40 0 44-20z"/></g><circle cx="104" cy="74" r="9" fill="var(--rose)" stroke="none"/><circle cx="130" cy="246" r="9" fill="var(--gold)" stroke="none"/></svg>
<svg class="vine r" viewBox="0 0 200 420" fill="none" stroke="var(--leaf)" stroke-width="2" aria-hidden="true"><path d="M10 0C70 80 20 150 90 220S40 340 120 420"/><g fill="var(--leaf)" fill-opacity=".35"><path d="M52 70c30-20 50-6 52 8-24 14-44 10-52-8z"/><path d="M42 150c-28-14-48 2-48 16 24 12 42 6 48-16z"/><path d="M80 230c32-12 50 4 50 18-26 10-44 2-50-18z"/><path d="M62 320c-28-10-46 6-44 20 22 8 40 0 44-20z"/></g><circle cx="104" cy="74" r="9" fill="var(--gold)" stroke="none"/><circle cx="130" cy="246" r="9" fill="var(--rose)" stroke="none"/></svg>

<header>
<svg class="bloom" viewBox="0 0 200 200" aria-hidden="true">
<g id="flower"></g>
</svg>
<h1>कविताएँ &amp; गीत</h1>
<p class="sub">Kavitaye and Geet: poems and songs, written by hand and kept here.</p>
<div class="tabs" role="tablist" aria-label="Collections">
<button class="tab" role="tab" id="t-k" aria-selected="true" aria-controls="grid">Kavitaye</button>
<button class="tab" role="tab" id="t-g" aria-selected="false" aria-controls="grid">Geet</button>
</div>
</header>

<main><div class="grid" id="grid" role="tabpanel" aria-labelledby="t-k"></div></main>
<footer>Written and Published by Shree Vajendra Singh Rawat</footer>

<dialog id="dlg" aria-labelledby="dt"><div class="sheet">
<button class="close" id="cl" aria-label="Close">Close</button>
<svg class="orn" viewBox="0 0 120 30" fill="none" stroke="var(--gold)" stroke-width="1.6" aria-hidden="true"><path d="M4 15h42M74 15h42"/><circle cx="60" cy="15" r="5" fill="var(--rose)" stroke="none"/><path d="M60 10c-4-8-12-8-14-4M60 20c-4 8-12 8-14 4M60 10c4-8 12-8 14-4M60 20c4 8 12 8 14 4"/></svg>
<h3 id="dt"></h3><pre id="db"></pre>
</div></dialog>

<script>
/* ===== EDIT YOUR WRITINGS HERE: replace the samples with your own ===== */
const WORKS={
kavitaye:[
{t:"वो समाज जो बोल उठा लेकिन नहीं हैं उसपे अभी अकल ।",b:"वह समाज बोल तो उठा, \nपर उसमें अभी विवेक नहीं।, \nजब अधर्म का बोलबाला होता है,\nतो दोनों पक्षों का विनाश होता है।, \nदोनों सत्ता के भूखे हैं, \nपर किसी में सच्चा उद्देश्य नहीं।, \nवे अपनी महानता का बखान करते हैं, \nपर कोई वीरता का कर्म नहीं करते।, \nन समझ है, न योग्यता-, \nबस पूछते हैं,\n“हमें बदनाम करने वाले तुम कौन हो?”, \nधर्म को मिटाने को,\nतुम जैसे गीदड़ आते रहेंगे,\nपर जब तक नारायण का दिव्य अंश है,\nतुम्हारा विनाश निश्चित है।"},
{t:"वीरता की विदाई ।",b:"जब सत्ता में पापी बैठ जाएँ,\nतो उम्मीद कैसे जी पाए?,\nजिन पर हमला होना चाहिए था,\nवे हमारी दुर्दशा का मज़ा ले रहे हैं। \nदि आज उस न्याय-व्यवस्था पर प्रश्न उठते,\nतो समझ पाते कि जनता पर \nइतना बोझ क्यों है। वह एक ऐसा राजा था \nजिसने धर्म का पालन किया; \nफिर अंग्रेज़ आए \nउन्होंने सब कुछ लूट लिया, \nऔर जनता के लिए कुछ न छोड़ा। न धर्म के लिए युद्ध होगा, \nन बाहरी आक्रांताओं के विरुद्ध; \nजो बचा है, वही रह जाएगा, \nऔर वीरता व न्याय का अधिकार \nउन्हीं से छीन लिया जाएगा \nजो हार चुके हैं।"},
{t:"युवा और विचारधाराएँ",b:"युवा है देश की नई धड़कन,\nनई सुबह का सबसे पहला गीत,\nउसके हाथों में है इमारतें,\nउसके सपनों में भारत की प्रीत।\n\nकभी उम्मीद थी कि यही युवा,\nसोने की चिड़िया फिर उड़ाएगा,\nज्ञान, आविष्कार और कर्म से,\nनई ऊँचाइयों को छू आएगा।\n\nपर आज सड़कों पर नारे हैं,\nभावनाएँ कहीं तर्क से आगे,\nकिसी के इस्तीफ़े की माँग में,\nसमस्या छूटती है पीछे रह जाए।\n\nसिर्फ़ पद हटाने से अधर्म नहीं,\nजड़ों को समझना भी ज़रूरी,\nप्रदर्शन अधिकार है, पर यही भी,\nजिम्मेदारी और विवेक से हो ज़रूरी।\n\nमैं भी युवा हूँ, पढ़ने चला हूँ,\nप्रजा के हित का रास्ता चुनने,\nन केवल चीखना, बल्कि सीखना,\nअपने कंधों पर देश को चुनना।\n\nमहिलाओं की आवाज़ भी है आज,\nन्याय की प्यास, सम्मान की डोर,\nअधर्म किसी लिंग का नहीं होता,\nकर्तव्य है सबका, यही है शुरूआत।\n\nचाहिए ऐसा नेतृत्व हमें,\nजो ज्ञान से जुड़े, संयम से बँधे,\nन लोभ में, न मोह में डूबे,\nजनता के सुख के लिए जो बँधे।\n\nभारत एक गहरी राह पर है,\nपर रास्ते अभी पूरे बंद नहीं,\nअगर युवा सोचे, सीखे और बने,\nतो रात के बाद फिर सवेरा है।"}
],
geet:[
{t:"हे समाज क्या चाहता हैं तू ?",b:"हे समाज क्या चाहता हैं तू ? \nकब तक इस अन्याय को सहना चाहता हैं तू ? \nदुनिया लड़ रही अपने अधिकारों के लिए क्यू सोया हैं अभी तक तू ? \n\nसरकारे लूट रही जनता को लेकिन चुप रहना चाहती हैं तू । \nभ्रष्टाचार बढ़ते जा रही फिर भी बिक जाना चाहता हैं तू । \nकाम निकलवाना तेरी खून मैं उससे कब तक चलायेगा तू ? \n\nहे समाज क्या चाहता हैं तू । \nकब तक इस अन्याय को सहन चाहता हैं तू । \n\nधर्म निष्ट ना रही समाज मैं फिर भी हिन्दू कहता हैं तू । \nधर्म को पैसा खिला कर अपना ही परलोक खराब कर रहा हैं तू । \nलालच लोभ से कब तक जूझेगा अब तो बाहर निकाल वरना कली अंत मैं मृत्यु पा जाएगा तू । \nसमय हैं आज भी पर लगाना नहीं चाहता दिमाग तू । \nजिनकी सुनना चाहिए था उनको गली देता रहा तू । \n\nकब तक करेगा चापलूसी जब मरके ही अकेला जाएगा । \nअब तो रुकजा अधर्मी कब तक पाप कर पाएगा ।"},
{t:"बचे ल्य्या हमारी संस्कृति । ",b:"बचे ल्य्या हमारी संस्कृति । \nबचे ल्य्या हमारी देवभूमि । \nबचे ल्य्या हमारा पहाड़ा । \nबचे ल्य्या हमारा देवता । \nबचे ल्य्या । \nबचे ल्य्या हमारी संस्कृति । \nबचे ल्य्या हमारी देवभूमि । \nजनता माँगन मूल निवास प्रशाशन सुनाई दीयों देहरादून विकास । \nजनता मागन भू - कानून प्रशशन सुनाई दीयों उत्तराखंड विकास  \nबचे ल्य्या हमारी संस्कृति । \nबचे ल्य्या हमारी संस्कृति ।"},
{t:"कन बैठी तू कन बैठी, कन बैठी तू जात - पात करी ।",b:"कन बैठी तू कन बैठी, कन बैठी तू जात - पात करी । \nआरक्षण लेगिन हमारी नौकरी - चाकरी । \n\nलोडा बुरा हाल छन नौकरी को लगानु छो । \nअग्नि पुराण माना कर दी । \nअब तो छोड़ दया जात पाती । \n\nकन बैठी तू कन बैठी, कन बैठी तू जात - पात करी । \nआरक्षण लेगिन हमारी नौकरी - चाकरी । \n\nUGC आई गेन सभी लोगों का कांडा लगान । \nसभी लोगों का कांडा लगान । \n\nअब तो समझ लेया भेजी अब तो छोड़ दया जाती - पाती । \nदुनिया राज करोन यह नीची जाता यह नीची जाता । \nक्या कड़ी हम सभी भूला ? क्या करी हम सभी भुला ? \n\nद्वेष पैदा होगेन शक्ति चा गलत फायदा उठोन। \nरोक दया यह नीची जाता हम ते बख्श दया दाता,\nहम सभी माफी मागन माफ कर दया सभी लोगोन। \n\nदूर दशा हुई बेकार गरीबी मा बैठीगेन। \nगरीबी मा बैठीगेन। \n\nकन बैठी तू कन बैठी, कन बैठी तू जात - पात करी । \nआरक्षण लेगिन हमारी नौकरी - चाकरी ।"}
]};
/* ======================================================================= */
const $=s=>document.querySelector(s),grid=$("#grid"),dlg=$("#dlg");
const bud='<svg viewBox="0 0 40 40" aria-hidden="true"><g fill="var(--gold)"><ellipse cx="20" cy="10" rx="5" ry="9"/><ellipse cx="20" cy="30" rx="5" ry="9"/><ellipse cx="10" cy="20" rx="9" ry="5"/><ellipse cx="30" cy="20" rx="9" ry="5"/></g><circle cx="20" cy="20" r="4" fill="var(--rose)"/></svg>';
function show(k){
 grid.innerHTML="";
 WORKS[k].forEach(w=>{
  const c=document.createElement("button");c.className="card";
  c.innerHTML="<h2></h2><p></p>"+bud;
  c.querySelector("h2").textContent=w.t;
  c.querySelector("p").textContent=w.b.split("\n").slice(0,2).join("\n")+" …";
  c.onclick=()=>{$("#dt").textContent=w.t;$("#db").textContent=w.b;dlg.showModal()};
  grid.appendChild(c);
 });
 [["k","kavitaye"],["g","geet"]].forEach(([i,n])=>$("#t-"+i).setAttribute("aria-selected",n===k));
 grid.setAttribute("aria-labelledby",k==="geet"?"t-g":"t-k");
}
$("#t-k").onclick=()=>show("kavitaye");$("#t-g").onclick=()=>show("geet");
$("#cl").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
show("kavitaye");

/* blooming flower */
(()=>{const g=$("#flower");let h="";
 const cols=["var(--rose)","var(--gold)"];
 for(let i=0;i<12;i++){const r=i*30,o=i%2;
  h+=`<g class="p" style="--i:${i}" transform="rotate(${r} 100 100)"><path d="M100 100C84 70 88 28 100 8C112 28 116 70 100 100Z" fill="${cols[o]}" fill-opacity="${o?0.55:0.8}" stroke="var(--ink)" stroke-opacity=".25"/></g>`;}
 h+='<circle cx="100" cy="100" r="11" fill="var(--leaf)"/><circle cx="100" cy="100" r="5" fill="var(--gold)"/>';
 g.innerHTML=h;})();

/* drifting petals */
(()=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const cv=$("#petals"),x=cv.getContext("2d");let W,H,P=[];
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener("resize",rs);
 const cl=["#e06b8e","#f2b632","#f6e9c8","#7fbf8e"];
 const mk=()=>({x:Math.random()*W,y:-20-Math.random()*H,s:6+Math.random()*9,v:.4+Math.random()*.8,w:Math.random()*6,a:Math.random()*6,c:cl[Math.random()*4|0]});
 for(let i=0;i<26;i++){P.push(mk());P[i].y=Math.random()*H}
 (function f(){x.clearRect(0,0,W,H);
  P.forEach(p=>{p.y+=p.v;p.w+=.015;p.a+=.02;p.x+=Math.sin(p.w)*.6;
   if(p.y>H+20)Object.assign(p,mk(),{y:-20});
   x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=.55;x.fillStyle=p.c;
   x.beginPath();x.ellipse(0,0,p.s*.45,p.s,0,0,7);x.fill();x.restore()});
  requestAnimationFrame(f)})();})();
</script>
</body>
</html>
